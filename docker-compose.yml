services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mountainguard-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: mountainguard-db
    environment:
      POSTGRES_USER: mountainguard
      POSTGRES_PASSWORD: mountainguard
      POSTGRES_DB: mountainguard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mountainguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: mountainguard-api
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      DATABASE_URL: postgresql+psycopg://mountainguard:mountainguard@db:5432/mountainguard
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  simulator:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: mountainguard-simulator
    command: ["python", "sensor-simulator/run_all.py"]
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      SIMULATION_INTERVAL_SECONDS: 2
    depends_on:
      - mqtt

  dashboard:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    container_name: mountainguard-dashboard
    ports:
      - "5173:5173"
    depends_on:
      - api
